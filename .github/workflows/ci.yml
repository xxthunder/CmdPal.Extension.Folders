name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/gate

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tools/catalog.cs
      - run: dotnet test tests/FoldersCatalog.Tests/FoldersCatalog.Tests.csproj
      - run: dotnet test tests/CmdPal.Extension.Shortcuts.Tests/CmdPal.Extension.Shortcuts.Tests.csproj -p:Platform=x64
      - run: dotnet build src/CmdPal.Extension.Shortcuts/CmdPal.Extension.Shortcuts.csproj -c Release -p:Platform=x64
